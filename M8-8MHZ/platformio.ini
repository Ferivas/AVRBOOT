; Bootloader Optiboot para ATmega8/A — RC interno 8 MHz, 38400 baud, LED PB2 activo en bajo
; Grabar bootloader (una sola vez con USBasp) y luego subir apps por serial.
;
; Uso:
;   1. Conectar USBasp al ICSP -> pio run -e burn_bootloader -t fuses
;                                   pio run -e burn_bootloader -t bootloader
;      (o combinado: pio run -e burn_bootloader -t fuses -t bootloader)
;   2. Desconectar USBasp, conectar conversor USB-Serie a PD0(RX)/PD1(TX)+RESET+DTR
;      -> pio run -e app -t upload  (puerto: /dev/ttyUSB0, cambia upload_port)
;   3. Monitor: pio device monitor -e app
;
; UART del ATmega8: RXD = PD0 (pin 2), TXD = PD1 (pin 3)
; LED de boot: PB2, ACTIVO EN BAJO (3 parpadeos al reset, apagado al saltar a la app)
; Sin cristal: reloj = oscilador RC interno calibrado a 8 MHz.

[platformio]
default_envs = app

; ── Aplicación normal: se sube por puerto serie usando el bootloader ──
[env:app]
platform = atmelavr
board = ATmega8
framework = arduino
board_build.f_cpu = 8000000L

; Subida por bootloader Optiboot (protocolo STK500v1 / "arduino")
upload_protocol = arduino
upload_speed = 38400
upload_port = /dev/ttyUSB0      ; <-- cambia a tu puerto: COM3 en Windows, /dev/ttyUSB0 o /dev/ttyACM0 en Linux
upload_flags = -P$UPLOAD_PORT
upload_resetmethod = dtr_rts    ; requiere condensador 100nF de DTR a RESET + pull-up 10k a VCC

monitor_port = /dev/ttyUSB0
monitor_speed = 9600

; Metadatos del bootloader (para `pio run -t bootloader` si usas esta env con ISP)
; OJO: en esta versión de la plataforma atmelavr la clave es "lfuse" (no "ldfuse").
; El ATmega8 NO tiene byte efuse: no definir board_bootloader.efuse ni board_fuses.efuse.
; lfuse 0xC4 = RC 8 MHz + arranque SUT=00 (el de fábrica, el más largo y seguro).
board_bootloader.file = bootloader/optiboot_atmega8_8M_38400_LED_B2inv.hex
board_bootloader.lfuse = 0xC4
board_bootloader.hfuse = 0xDC
board_bootloader.lock_bits = 0x0F
board_bootloader.unlock_bits = 0x3F

; ── Grabación inicial del bootloader + fuses con USBasp (solo 1 vez) ──
[env:burn_bootloader]
platform = atmelavr
board = ATmega8
; sin framework: solo graba hex + fuses, no compila app
upload_protocol = usbasp
upload_flags =
  -Pusb
board_bootloader.file = bootloader/optiboot_atmega8_8M_38400_LED_B2inv.hex
board_bootloader.lfuse = 0xC4
board_bootloader.hfuse = 0xDC
board_bootloader.lock_bits = 0x0F
board_bootloader.unlock_bits = 0x3F
; El target `-t fuses` lee estas claves (sección "fuses"), sin ellas PlatformIO
; quema sus valores calculados en vez de los nuestros.
board_fuses.lfuse = 0xC4
board_fuses.hfuse = 0xDC
board_fuses.lock_bits = 0x0F
board_fuses.unlock_bits = 0x3F
; Para programadores USBasp lentos/clones, descomenta:
; upload_flags = -Pusb -B 10
